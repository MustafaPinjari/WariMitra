name: warimitra
description: WariMitra - Pilgrim Safety Mobile App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.0
  go_router: ^12.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  dio: ^5.3.1
  dio_cache_interceptor: ^3.4.1
  flutter_secure_storage: ^9.0.0
  geolocator: ^9.0.0
  google_maps_flutter: ^2.5.0
  flutter_map: ^6.0.1
  latlong2: ^0.9.1
  permission_handler: ^11.4.3
  workmanager: ^0.5.1
  firebase_core: ^2.24.0
  firebase_crashlytics: ^3.4.0
  firebase_analytics: ^10.7.0
  intl: ^0.18.0
  flutter_vibrate: ^1.3.0
  connectivity_plus: ^5.0.1
  package_info_plus: ^4.1.0
  device_info_plus: ^9.0.2
  http: ^1.1.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.1
  json_serializable: ^6.7.1
  mockito: ^5.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
